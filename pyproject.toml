[project]
name = "bb-recon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
]

[tool.ruff]
target-version = "py312"
line-length = 120

# Linting rules
[tool.ruff.lint]
select = [
    "I",    # sort imports
    "TC",   # Enforce TYPE_CHECKING usage
    "PTH",  # Use pathlib instead of os.path
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "B",    # bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "ARG",  # Flags unused function arguments
    "RUF022" # Unsorted __all__ blocks
]
ignore = [
    "E501", # line length handled by formatter
]
per-file-ignores = {"**/tests/**/*" = ["D", "S101", "S104", "ARG"]}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bb_recon"]

[project.scripts]
recon = "bb_recon.cli:joy"

[dependency-groups]
dev = [
    "ruff>=0.14.13",
]

